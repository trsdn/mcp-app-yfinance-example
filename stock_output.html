<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #f1f5f9;
            padding: 16px;
            min-height: 200px;
        }
        .card {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .ticker {
            font-size: 14px;
            color: #94a3b8;
            font-weight: 500;
        }
        .name {
            font-size: 18px;
            font-weight: 600;
            margin-top: 4px;
        }
        .price-section {
            text-align: right;
        }
        .price {
            font-size: 28px;
            font-weight: 700;
        }
        .change {
            font-size: 14px;
            margin-top: 4px;
            color: #22c55e;
        }
        .chart {
            margin: 20px 0;
            height: 100px;
            background: rgba(15, 23, 42, 0.3);
            border-radius: 8px;
            padding: 8px;
        }
        .chart-label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #64748b;
            margin-top: 4px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 16px;
        }
        .stat {
            text-align: center;
            padding: 8px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
        }
        .stat-label {
            font-size: 11px;
            color: #64748b;
            text-transform: uppercase;
        }
        .stat-value {
            font-size: 14px;
            font-weight: 600;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div>
                <div class="ticker">AAPL</div>
                <div class="name">Apple Inc.</div>
            </div>
            <div class="price-section">
                <div class="price">$258.28</div>
                <div class="change">▲ $1.84 (0.72%)</div>
            </div>
        </div>
        
        <div class="chart">
            
            <svg width="100%" height="85" viewBox="0 0 300 85" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#22c55e;stop-opacity:0.3"/>
                        <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.05"/>
                    </linearGradient>
                </defs>
                <polygon fill="url(#chartGradient)" points="0.0,16.1 15.0,18.8 30.0,20.6 45.0,29.0 60.0,39.8 75.0,44.3 90.0,47.2 105.0,46.4 120.0,44.5 135.0,42.7 150.0,45.1 165.0,49.0 180.0,55.0 195.0,74.5 210.0,72.4 225.0,70.9 240.0,71.6 255.0,55.2 270.0,48.9 285.0,52.9 300.0,48.9 300,85 0,85"/>
                <polyline fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" points="0.0,16.1 15.0,18.8 30.0,20.6 45.0,29.0 60.0,39.8 75.0,44.3 90.0,47.2 105.0,46.4 120.0,44.5 135.0,42.7 150.0,45.1 165.0,49.0 180.0,55.0 195.0,74.5 210.0,72.4 225.0,70.9 240.0,71.6 255.0,55.2 270.0,48.9 285.0,52.9 300.0,48.9"/>
            </svg>
        
            <div class="chart-label">
                <span>1 month ago</span>
                <span>Today</span>
            </div>
        </div>
        
        <div class="stats">
            <div class="stat">
                <div class="stat-label">Open</div>
                <div class="stat-value">$258.07</div>
            </div>
            <div class="stat">
                <div class="stat-label">High</div>
                <div class="stat-value">$259.65</div>
            </div>
            <div class="stat">
                <div class="stat-label">Low</div>
                <div class="stat-value">$254.41</div>
            </div>
            <div class="stat">
                <div class="stat-label">Volume</div>
                <div class="stat-value">55.64M</div>
            </div>
            <div class="stat">
                <div class="stat-label">Market Cap</div>
                <div class="stat-value">3.82T</div>
            </div>
            <div class="stat">
                <div class="stat-label">52W Range</div>
                <div class="stat-value">$169 - $289</div>
            </div>
        </div>
    </div>
</body>
</html>
