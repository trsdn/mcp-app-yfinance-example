<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; background: #1e293b; color: white; padding: 20px; }
        .card { background: #334155; padding: 20px; border-radius: 8px; }
        .positive { color: #22c55e; }
        .negative { color: #ef4444; }
    </style>
</head>
<body>
    <div id="app">Loading...</div>
    
    <script>
        // Embedded data (simulating what the server would inject)
        const stockData = {
            "ticker": "AAPL",
            "name": "Apple Inc.",
            "price": 258.28,
            "change": 0.72,
            "changeAmount": 1.84,
            "history": [250, 255, 260, 258, 262, 265],
            "period": "3mo",
            "periodLabel": "3 months"
        };
        
        function render(data) {
            const app = document.getElementById('app');
            const changeClass = data.change >= 0 ? 'positive' : 'negative';
            const changeSymbol = data.change >= 0 ? '▲' : '▼';
            
            app.innerHTML = `
                <div class="card">
                    <h1>${data.name} (${data.ticker})</h1>
                    <div style="font-size: 32px; font-weight: bold;">$${data.price.toFixed(2)}</div>
                    <div class="${changeClass}">${changeSymbol} ${data.change.toFixed(2)}% ($${data.changeAmount.toFixed(2)})</div>
                    <div style="margin-top: 10px; color: #94a3b8;">Period: ${data.periodLabel}</div>
                </div>
            `;
        }
        
        // Auto-render on DOM ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM ready, rendering...');
            render(stockData);
        });
    </script>
</body>
</html>
